t fill="#000000" font-family="Arial" font-size="11" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="131" x="98" y="587.0186">[More waves remaining]</text><line style="stroke: #181818; stroke-width: 1.0;" x1="129" x2="171" y1="612.4014" y2="612.4014"/><line style="stroke: #181818; stroke-width: 1.0;" x1="171" x2="171" y1="612.4014" y2="625.4014"/><line style="stroke: #181818; stroke-width: 1.0;" x1="130" x2="171" y1="625.4014" y2="625.4014"/><polygon fill="#181818" points="140,621.4014,130,625.4014,140,629.4014,136,625.4014" style="stroke: #181818; stroke-width: 1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="94" x="136" y="607.2656">getNextWave()</text><!--
@startuml
skinparam shadowing false
skinparam defaultFontName Arial
skinparam classAttributeIconSize 0
skinparam titleFontSize 15
skinparam titleFontStyle bold
skinparam captionFontSize 11
skinparam captionFontColor #7a2e2e
skinparam class {
  BackgroundColor #F1F1F1
  BorderColor #181818
  ArrowColor #181818
}
skinparam stereotypeCBackgroundColor #ADD1B2
skinparam sequence {
  ParticipantBackgroundColor #E2E2F0
  ParticipantBorderColor #181818
  ActorBackgroundColor #E2E2F0
  ActorBorderColor #181818
  ArrowColor #181818
  LifeLineBorderColor #181818
  LifeLineBackgroundColor #FFFFFF
  GroupBorderColor #000000
  GroupBackgroundColor #EEEEEE
}
skinparam noteBackgroundColor #FEFFDD
skinparam noteBorderColor #181818
title Figure 8 (v1). Item use and wave dispersal sequence
caption Version 1 · 30 October 2026 · superseded by version 2 (12 November 2026). Redrawn from the original PlantUML; content unchanged.
actor User
participant Game
participant Player
participant Item
participant Goose
participant Score
User -> Game : uses an item
Game -> Player : useItem(inventorySlot)
Player -> Item : applyToGeese(geese)
Item -> Goose : disperseGoose()
Goose - -> Item
Item - -> Player
Player - -> Game
Game -> Score : incrementItemsUsed()
alt Wave dispersed
  Game -> Score : addDispersalPoints(geeseCount, timeElapsed)
  Score -> Score : calculateTimeBonus(timeElapsed)
  Game -> Score : applyItemBonus(item)
end
Game -> Score : isAllDispersed()
Score - -> Game : result
alt All waves dispersed
  Game -> Game : endGame()
else More waves remaining
  Game -> Game : getNextWave()
end
@enduml

