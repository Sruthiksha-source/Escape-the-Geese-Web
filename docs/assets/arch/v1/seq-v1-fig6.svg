@startuml
skinparam shadowing false
skinparam defaultFontName Arial
skinparam classAttributeIconSize 0
skinparam titleFontSize 15
skinparam titleFontStyle bold
skinparam captionFontSize 11
skinparam captionFontColor #7a2e2e
skinparam class {
  BackgroundColor #F1F1F1
  BorderColor #181818
  ArrowColor #181818
}
skinparam stereotypeCBackgroundColor #ADD1B2
skinparam sequence {
  ParticipantBackgroundColor #E2E2F0
  ParticipantBorderColor #181818
  ActorBackgroundColor #E2E2F0
  ActorBorderColor #181818
  ArrowColor #181818
  LifeLineBorderColor #181818
  LifeLineBackgroundColor #FFFFFF
  GroupBorderColor #000000
  GroupBackgroundColor #EEEEEE
}
skinparam noteBackgroundColor #FEFFDD
skinparam noteBorderColor #181818
title Figure 6 (v1). Event triggering and game completion sequence
caption Version 1 · 30 October 2026 · superseded by version 2 (12 November 2026). Redrawn from the original PlantUML; content unchanged.
participant Game
participant Player
participant Event
participant Score
Game -> Game : checkForEvents()
Game -> Player : getLocation()
Player - -> Game : location
Game -> Event : isInTriggerRange(location)
Event - -> Game : result
alt Event in range
  Game -> Game : activateEvent()
  Game -> Event : trigger()
  Game -> Event : affectPlayer(Player)
  Game -> Event : affectGeese(geese)
  Game -> Event : modifyScore(Score)
end
Game -> Game : checkForWin()
Game -> Score : isAllDispersed()
Score - -> Game : result
alt All geese dispersed
  Game -> Game : endGame()
end
@enduml

