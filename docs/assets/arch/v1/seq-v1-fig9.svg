 stroke-width: 1.0;" x1="166.5" x2="289.5" y1="519.0918" y2="519.0918"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="105" x="173.5" y="513.9561">pickUpItem(item)</text><polygon fill="#181818" points="177.5,544.8213,167.5,548.8213,177.5,552.8213,173.5,548.8213" style="stroke: #181818; stroke-width: 1.0;"/><line style="stroke: #181818; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="171.5" x2="294.5" y1="548.8213" y2="548.8213"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="35" x="183.5" y="543.6855">result</text><polygon fill="#181818" points="346.5,581.5508,356.5,585.5508,346.5,589.5508,350.5,585.5508" style="stroke: #181818; stroke-width: 1.0;"/><line style="stroke: #181818; stroke-width: 1.0;" x1="166.5" x2="352.5" y1="585.5508" y2="585.5508"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="123" x="173.5" y="580.415">modifyScore(score)</text><polygon fill="#181818" points="543.5,611.2803,553.5,615.2803,543.5,619.2803,547.5,615.2803" style="stroke: #181818; stroke-width: 1.0;"/><line style="stroke: #181818; stroke-width: 1.0;" x1="358.5" x2="549.5" y1="615.2803" y2="615.2803"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="173" x="365.5" y="610.1445">setMultiplier(scoreModifier)</text><!--
@startuml
skinparam shadowing false
skinparam defaultFontName Arial
skinparam classAttributeIconSize 0
skinparam titleFontSize 15
skinparam titleFontStyle bold
skinparam captionFontSize 11
skinparam captionFontColor #7a2e2e
skinparam class {
  BackgroundColor #F1F1F1
  BorderColor #181818
  ArrowColor #181818
}
skinparam stereotypeCBackgroundColor #ADD1B2
skinparam sequence {
  ParticipantBackgroundColor #E2E2F0
  ParticipantBorderColor #181818
  ActorBackgroundColor #E2E2F0
  ActorBorderColor #181818
  ArrowColor #181818
  LifeLineBorderColor #181818
  LifeLineBackgroundColor #FFFFFF
  GroupBorderColor #000000
  GroupBackgroundColor #EEEEEE
}
skinparam noteBackgroundColor #FEFFDD
skinparam noteBorderColor #181818
title Figure 9 (v1). Event triggering, item spawning and score modification sequence
caption Version 1 · 30 October 2026 · superseded by version 2 (12 November 2026). Redrawn from the original PlantUML; content unchanged.
participant Game
participant Player
participant Event
participant Score
Game -> Game : checkForEvents()
Game -> Player : getLocation()
Player - -> Game : location
Game -> Event : isInTriggerRange(location)
Event - -> Game : result
alt Event in range
  Game -> Game : activateEvent()
  note right of Game : increments eventsTriggered
  Game -> Event : trigger()
  Event -> Event : playSound()
  Game -> Event : spawnItems()
  Event - -> Game : items
  loop for each spawned item
    Game -> Player : pickUpItem(item)
    Player - -> Game : result
  end
  Game -> Event : modifyScore(score)
  Event -> Score : setMultiplier(scoreModifier)
end
@enduml

