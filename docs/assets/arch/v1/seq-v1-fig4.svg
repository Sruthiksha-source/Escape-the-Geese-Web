@startuml
skinparam shadowing false
skinparam defaultFontName Arial
skinparam classAttributeIconSize 0
skinparam titleFontSize 15
skinparam titleFontStyle bold
skinparam captionFontSize 11
skinparam captionFontColor #7a2e2e
skinparam class {
  BackgroundColor #F1F1F1
  BorderColor #181818
  ArrowColor #181818
}
skinparam stereotypeCBackgroundColor #ADD1B2
skinparam sequence {
  ParticipantBackgroundColor #E2E2F0
  ParticipantBorderColor #181818
  ActorBackgroundColor #E2E2F0
  ActorBorderColor #181818
  ArrowColor #181818
  LifeLineBorderColor #181818
  LifeLineBackgroundColor #FFFFFF
  GroupBorderColor #000000
  GroupBackgroundColor #EEEEEE
}
skinparam noteBackgroundColor #FEFFDD
skinparam noteBorderColor #181818
title Figure 4 (v1). Player movement and item usage sequence
caption Version 1 · 30 October 2026 · superseded by version 2 (12 November 2026). Redrawn from the original PlantUML; content unchanged.
actor User
participant Player
participant Game
participant Item
participant Score
User -> Player : moves player up
Player -> Player : moveUp()
alt direction == moves down
  User -> Player : moves player down
  Player -> Player : moveDown()
end
alt direction == left
  User -> Player : moves player left
  Player -> Player : moveLeft()
end
alt direction == right
  User -> Player : moves player right
  Player -> Player : moveRight()
end
Player -> Game : checkForEvents()
User -> Player : picks up an item
Player -> Item : getEffectType()
Item - -> Player : result
Player -> Item : getStrength()
Item - -> Player : result
User -> Player : Uses an item
Player -> Item : applyToPlayer()
Player -> Item : applyToGeese()
Player -> Score : incrementItemsUsed()
Player -> Player : increaseScore()
Player -> Score : applyItemBonus()
Player -> Game : isGameOver()
@enduml

